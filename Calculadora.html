<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .calculadora {
            border: 2px solid #000;
            padding: 15px;
            width: 250px;
        }

        .campo {
            margin-bottom: 8px;
        }

        label {
            display: inline-block;
            width: 80px;
        }

        .teclado {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .teclado button {
            width: 35px;
            height: 35px;
            margin: 2px;
        }

        .teclado button#li {
            width: 75px; 
        }

        .operaciones button {
            padding: 5px;
            margin: 2px;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <h3>Calculadora</h3>

        <div class="campo">
            <label>Valor 1:</label>
            <input type="text" id="Campo1">
        </div>
        <div class="campo">
            <label>Valor 2:</label>
            <input type="text" id="Campo2">
        </div>
        <div class="campo">
            <label>Resultado:</label>
            <input type="text" id="Resultado">
        </div>

        <div class="teclado">
            <button>1</button>
            <button>2</button>
            <button>3</button><br>
            <button>4</button>
            <button>5</button>
            <button>6</button><br>
            <button>7</button>
            <button>8</button>
            <button>9</button><br>
            <button>0</button>
            <button id="li">Limpiar</button>
        </div>
  
        <div class="operaciones">
            <button onclick="suma()">Sumar</button>
            <button onclick="restar()">Restar</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
            <button onclick="potenciacion()">Potencia</button>
            <button onclick="calcularRaiz()">Raíz</button>
            <button onclick="verificarMultiplo()">Múltiplo</button>
            <button onclick="verTamanocadena()">Tamaño</button>
            <button onclick="compararValores()">Comparar</button>
        </div>
    </div>


    <div class="calculadora">
        <h3>Operaciones con Cadenas</h3>

        <div class="campo">
            <label>Cadena 1:</label>
            <input type="text" id="Cad1">
        </div>
        <div class="campo">
            <label>Cadena 2:</label>
            <input type="text" id="Cad2">
        </div>
        <div class="campo">
            <label>Resultado:</label>
            <input type="text" id="ResCad" readonly>
        </div>

        <div class="operaciones">
            <button onclick="cadComparar()">Comparar</button>
            <button onclick="cadContar()">Contar</button>
            <button onclick="cadEspacios()">Espacios</button>
            <button onclick="cadInsertar()">Insertar</button>
        </div>
    </div>

    <script src="Calculadora.js"></script>
</body>
</html>
