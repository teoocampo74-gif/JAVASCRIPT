<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de funciones</title>
</head>
<body>
    
</body>
<script>
// Funcion por Declaracion
 
function saludar(){
  return "Hola";
}
console.log(saludar()); 

// Funcion por Expresion
const saludo = function saludar(){
    return "Hola";
}
console.log(saludo())

// Funcion Anonima
const saludo1 = function(){
    return "Hola";
}
console.log(saludo1())

//Funcion Constructora

</script>
</html>
